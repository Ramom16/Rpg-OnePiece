name: Deploy to GitHub Pages

on:
  push:
    branches: ['main'] # Substitua por 'master' se a sua branch principal for master

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: 'pages'
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm install
        working-directory: ./frontend # Remova esta linha se o package.json estiver na raiz do repositório

      - name: Build
        run: npm run build
        working-directory: ./frontend # Remova esta linha se o package.json estiver na raiz do repositório
        env:
          VITE_API_URL: ${{ vars.VITE_API_URL }}

      - name: Setup Pages
        uses: actions/configure-pages@v4

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: './frontend/dist' # Mude para './dist' se o package.json estiver na raiz do repositório

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
